<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Captain Pickle's Joke Machine</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", sans-serif;
      color: #17324d;
      background: #dff6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 20%, #fff8c7 0 7px, transparent 8px),
        radial-gradient(circle at 85% 75%, #b8efd5 0 9px, transparent 10px),
        linear-gradient(145deg, #dff6ff, #c8efff);
    }

    .machine {
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 56px);
      text-align: center;
      background: #fff;
      border: 5px solid #17324d;
      border-radius: 32px;
      box-shadow: 10px 12px 0 #17324d;
    }

    .pickle {
      margin: 0 0 8px;
      font-size: 4rem;
      line-height: 1;
    }

    h1 {
      margin: 0;
      color: #176b58;
      font-size: clamp(2.4rem, 8vw, 4rem);
      line-height: 1.05;
    }

    .intro {
      margin: 18px 0 28px;
      font-size: 1.15rem;
    }

    button {
      padding: 16px 28px;
      border: 3px solid #17324d;
      border-radius: 18px;
      background: #ffdf4d;
      color: #17324d;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #17324d;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #17324d;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #17324d;
    }

    button:focus-visible {
      outline: 4px solid #176b58;
      outline-offset: 5px;
    }

    .joke {
      min-height: 3.5em;
      margin: 30px 0 0;
      color: #643f91;
      font-size: clamp(1.25rem, 4vw, 1.65rem);
      font-weight: 700;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="machine">
    <p class="pickle" aria-hidden="true">🥒</p>
    <h1>Hello, Captain Dino!</h1>
    <p class="intro">Welcome aboard the giggle ship. Ready for a joke?</p>
    <button id="joke-button" type="button">Tell me a joke!</button>
    <p class="joke" id="joke" role="status" aria-live="polite">Your joke will appear here!</p>
  </main>

  <script>
    const jokes = [
      "Why did the banana go to the doctor? It wasn't peeling well!",
      "What do you call a bear with no teeth? A gummy bear!",
      "Why did the student eat their homework? The teacher said it was a piece of cake!",
      "What do you call a sleeping dinosaur? A dino-snore!",
      "Why can't a bicycle stand up by itself? It's two-tired!",
      "What kind of tree fits in your hand? A palm tree!",
      "Why did the teddy bear say no to dessert? It was stuffed!",
      "What do you call cheese that isn't yours? Nacho cheese!",
      "Why do cows wear bells? Because their horns don't work!",
      "What do you call an alligator in a vest? An investigator!",
      "Why are fish so smart? They live in schools!"
    ];

    const jokeElement = document.querySelector("#joke");
    const jokeButton = document.querySelector("#joke-button");

    jokeButton.addEventListener("click", () => {
      const randomIndex = Math.floor(Math.random() * jokes.length);
      jokeElement.textContent = jokes[randomIndex];
    });
  </script>
</body>
</html>
